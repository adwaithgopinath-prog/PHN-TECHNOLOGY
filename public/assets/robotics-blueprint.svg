<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="glow-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#003399" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="glow-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbb700" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b38200" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Circuit Trace Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
    </pattern>

    <!-- Glowing Node -->
    <filter id="node-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Blueprint Background Grid -->
  <rect width="1000" height="1000" fill="url(#grid)" />

  <g stroke="rgba(255,255,255,0.2)" stroke-width="1" fill="none">
    <!-- Center AI Chip outline -->
    <rect x="400" y="400" width="200" height="200" rx="10" />
    <rect x="420" y="420" width="160" height="160" rx="5" stroke="url(#glow-blue)" />
    <!-- Chip pins -->
    <path d="M 380 430 h 20 M 380 450 h 20 M 380 470 h 20 M 380 490 h 20 M 380 510 h 20 M 380 530 h 20 M 380 550 h 20 M 380 570 h 20" />
    <path d="M 600 430 h 20 M 600 450 h 20 M 600 470 h 20 M 600 490 h 20 M 600 510 h 20 M 600 530 h 20 M 600 550 h 20 M 600 570 h 20" />
    <path d="M 430 380 v 20 M 450 380 v 20 M 470 380 v 20 M 490 380 v 20 M 510 380 v 20 M 530 380 v 20 M 550 380 v 20 M 570 380 v 20" />
    <path d="M 430 600 v 20 M 450 600 v 20 M 470 600 v 20 M 490 600 v 20 M 510 600 v 20 M 530 600 v 20 M 550 600 v 20 M 570 600 v 20" />

    <!-- AI Core Circuit Traces -->
    <path d="M 400 450 L 300 450 L 250 400 L 150 400" stroke="url(#glow-blue)" />
    <circle cx="150" cy="400" r="4" fill="#0066ff" filter="url(#node-glow)" />

    <path d="M 600 550 L 700 550 L 750 600 L 850 600" stroke="url(#glow-blue)" />
    <circle cx="850" cy="600" r="4" fill="#0066ff" filter="url(#node-glow)" />

    <path d="M 500 400 L 500 300 L 550 250 L 550 150" />
    <circle cx="550" cy="150" r="3" fill="#ffffff" />

    <path d="M 500 600 L 500 700 L 450 750 L 450 850" stroke="url(#glow-gold)" />
    <circle cx="450" cy="850" r="4" fill="#fbb700" filter="url(#node-glow)" />

    <path d="M 400 550 L 350 550 L 300 600 L 300 700 L 250 750" />
    <circle cx="250" cy="750" r="3" fill="#ffffff" />

    <path d="M 600 450 L 650 450 L 700 400 L 700 300 L 750 250" />
    <circle cx="750" cy="250" r="3" fill="#ffffff" />

    <!-- Robotic Arm Silhouette (Stylized Blueprint) -->
    <path d="M 800 900 L 800 850 L 780 830 L 780 750 L 820 710 L 820 600" stroke-width="2" stroke="rgba(255,255,255,0.15)" />
    <path d="M 820 600 L 850 570 L 900 570" stroke-width="2" stroke="rgba(255,255,255,0.15)" />
    <circle cx="820" cy="600" r="15" />
    <circle cx="780" cy="750" r="10" />
    <circle cx="900" cy="570" r="8" />

    <path d="M 100 800 L 100 750 L 150 700 L 150 600 L 200 550 L 300 550" stroke-width="2" stroke="rgba(255,255,255,0.1)" />
    <circle cx="150" cy="600" r="12" />
    <circle cx="200" cy="550" r="8" />

    <!-- Geometric Tech Objects -->
    <polygon points="100,200 150,150 200,200 150,250" stroke="url(#glow-gold)" stroke-width="1" />
    <circle cx="150" cy="200" r="2" fill="#fbb700" />
    <path d="M 150 200 L 200 150 L 250 150" stroke="rgba(255,255,255,0.1)" />
    
    <polygon points="800,150 850,150 870,200 820,200" />
    <path d="M 800 150 L 750 100" stroke="url(#glow-blue)" />
    <circle cx="750" cy="100" r="3" fill="#0066ff" filter="url(#node-glow)" />

    <circle cx="850" cy="800" r="50" stroke-dasharray="10 5" stroke="rgba(255,255,255,0.2)" />
    <circle cx="850" cy="800" r="30" stroke="url(#glow-blue)" />

    <circle cx="200" cy="800" r="40" stroke-dasharray="5 10" stroke="rgba(255,255,255,0.15)" />
    <path d="M 200 760 L 200 840 M 160 800 L 240 800" />

    <circle cx="300" cy="200" r="60" stroke-dasharray="15 15" stroke="rgba(255,255,255,0.1)" />
    <circle cx="300" cy="200" r="45" stroke="rgba(255,255,255,0.05)" />

    <!-- Additional IoT Nodes Network -->
    <path d="M 100 500 L 150 450 L 200 480 L 250 420 L 300 460" stroke="rgba(255,255,255,0.1)" stroke-width="0.5" />
    <circle cx="100" cy="500" r="2" fill="#fff" />
    <circle cx="150" cy="450" r="2" fill="#fff" />
    <circle cx="200" cy="480" r="3" fill="#0066ff" filter="url(#node-glow)" />
    <circle cx="250" cy="420" r="2" fill="#fff" />
    <circle cx="300" cy="460" r="2" fill="#fff" />

    <path d="M 700 700 L 750 750 L 800 720 L 850 780 L 900 740" stroke="rgba(255,255,255,0.1)" stroke-width="0.5" />
    <circle cx="700" cy="700" r="2" fill="#fff" />
    <circle cx="750" cy="750" r="3" fill="#fbb700" filter="url(#node-glow)" />
    <circle cx="800" cy="720" r="2" fill="#fff" />
    <circle cx="850" cy="780" r="2" fill="#fff" />
    <circle cx="900" cy="740" r="2" fill="#fff" />

    <!-- Concentric tech circles in corners -->
    <circle cx="50" cy="50" r="100" stroke-width="0.5" stroke="rgba(255,255,255,0.1)" />
    <circle cx="50" cy="50" r="80" stroke-width="1" stroke="rgba(0,102,255,0.2)" stroke-dasharray="20 10" />
    
    <circle cx="950" cy="950" r="120" stroke-width="0.5" stroke="rgba(255,255,255,0.05)" />
    <circle cx="950" cy="950" r="90" stroke-width="1" stroke="rgba(251,183,0,0.15)" stroke-dasharray="30 15" />

  </g>
</svg>
